<!-- combined.html (Modules 7, 8, 9 Combined with CSS) -->
<!DOCTYPE html>
<html>
<head>
    <title>Combined Modules (7, 8, 9)</title>
    <!-- Links to the original CSS from the zip file -->
    <link rel="stylesheet" href="css/anika.css">
    <style>
        /* Minimal layout structuring to separate the forms */
        .module-section { margin-bottom: 20px; padding: 15px; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <div class="module-section">
        <h2>Module 7: Payments & Receipts</h2>
        <input type="number" id="orderId" placeholder="Order ID">
        <input type="number" id="payAmount" placeholder="Amount">
        <select id="paymentMethod">
            <option value="Cash">Cash</option>
            <option value="GCash">GCash</option>
            <option value="Bank Transfer">Bank Transfer</option>
        </select>
        <input type="text" id="proofOfPayment" placeholder="Proof File (if non-cash)">
        <button onclick="processPayment()">Submit Payment</button>
        <div id="receiptOutput"></div>
    </div>

    <div class="module-section">
        <h2>Module 9: Expense Management</h2>
        <select id="expenseCategory">
            <option value="Rent">Rent</option>
            <option value="Utilities">Utilities</option>
            <option value="Supplies">Supplies</option>
            <option value="Equipment Repair">Equipment Repair</option>
            <option value="Other">Other</option>
        </select>
        <input type="number" id="expAmount" placeholder="Amount">
        <input type="text" id="expenseDesc" placeholder="Description">
        <button onclick="addExpense()">Log Expense</button>
        <div id="expenseOutput"></div>
    </div>

    <div class="module-section">
        <h2>Module 8: Sales Reporting</h2>
        <label><input type="checkbox" id="isExamWeek"> Is Exam Week?</label>
        <button onclick="generateReport()">Generate Daily Report</button>
        <div id="reportOutput"></div>
    </div>

    <script>
        // Shared State Data Structures
        let payments = [];
        let receipts = [];
        let expenses = [];
        let paymentIdCounter = 1;
        let receiptIdCounter = 1;
        let expenseIdCounter = 1;

        // Module 7 Logic
        function processPayment() {
            let orderId = parseInt(document.getElementById("orderId").value);
            let amount = parseFloat(document.getElementById("payAmount").value);
            let method = document.getElementById("paymentMethod").value;
            let proof = document.getElementById("proofOfPayment").value;

            if (method !== "Cash" && proof === "") {
                document.getElementById("receiptOutput").innerText = "Error: Proof of payment required for " + method + "";
                return;
            }

            let newPayment = {
                paymentId: paymentIdCounter++,
                orderId: orderId,
                amount: amount,
                paymentMethod: method,
                proofOfPaymentFile: method === "Cash" ? null : proof
            };
            
            payments[payments.length] = newPayment; // No .push()

            let newReceipt = {
                receiptId: receiptIdCounter++,
                orderId: orderId,
                totalPrice: amount,
                dateIssued: new Date().toISOString()
            };
            
            receipts[receipts.length] = newReceipt;

            document.getElementById("receiptOutput").innerText = "Payment Added! Receipt ID: " + newReceipt.receiptId;
        }

        // Module 9 Logic
        function addExpense() {
            let category = document.getElementById("expenseCategory").value;
            let amount = parseFloat(document.getElementById("expAmount").value);
            let desc = document.getElementById("expenseDesc").value;

            let newExpense = {
                expenseId: expenseIdCounter++,
                category: category,
                amount: amount,
                description: desc,
                dateIncurred: new Date().toISOString()
            };

            expenses[expenses.length] = newExpense; // No .push()
            document.getElementById("expenseOutput").innerText = "Expense Added: " + category + " - P" + amount;
        }

        // Module 8 Logic
        function generateReport() {
            let totalRev = 0;
            let totalExp = 0;
            let isExam = document.getElementById("isExamWeek").checked;

            // Manual aggregation (No .reduce())
            for (let i = 0; i < payments.length; i++) {
                totalRev += payments[i].amount;
            }

            for (let j = 0; j < expenses.length; j++) {
                totalExp += expenses[j].amount;
            }

            let netProfit = totalRev - totalExp;

            document.getElementById("reportOutput").innerText = 
                "Gross Revenue: P" + totalRev + 
                "\nTotal Expenses: P" + totalExp + 
                "\nNet Profit: P" + netProfit + 
                "\nExam Week: " + isExam;
        }
    </script>
</body>
</html>
